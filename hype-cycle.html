<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant-Based Meat Hype Cycle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #fff;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container { width: 100%; max-width: 1200px; }
    h1 { text-align: center; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { text-align: center; font-size: 14px; color: #6b7280; margin-bottom: 16px; }
    svg { width: 100%; height: auto; display: block; }
    footer { text-align: center; font-size: 11px; color: #9ca3af; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>The Plant-Based Meat Hype Cycle</h1>
    <p class="subtitle">Impossible Foods & the broader market mapped to the Gartner framework</p>

    <svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg">

      <!-- Phase background bands -->
      <rect x="50" y="40" width="180" height="520" fill="#f0fdf4" rx="4" opacity="0.5"/>
      <rect x="230" y="40" width="250" height="520" fill="#fef3c7" rx="4" opacity="0.4"/>
      <rect x="480" y="40" width="260" height="520" fill="#fef2f2" rx="4" opacity="0.4"/>
      <rect x="740" y="40" width="220" height="520" fill="#eff6ff" rx="4" opacity="0.4"/>
      <rect x="960" y="40" width="200" height="520" fill="#f0fdf4" rx="4" opacity="0.3"/>

      <!-- Phase labels at top -->
      <text x="140" y="62" text-anchor="middle" font-size="12" font-weight="700" text-transform="uppercase" letter-spacing="0.05em" fill="#16a34a">TECHNOLOGY TRIGGER</text>

      <text x="355" y="62" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#d97706">PEAK OF INFLATED</text>
      <text x="355" y="76" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#d97706">EXPECTATIONS</text>

      <text x="610" y="62" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#dc2626">TROUGH OF</text>
      <text x="610" y="76" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#dc2626">DISILLUSIONMENT</text>

      <text x="850" y="62" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#0369a1">SLOPE OF</text>
      <text x="850" y="76" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#0369a1">ENLIGHTENMENT</text>

      <text x="1060" y="62" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#6b7280">PLATEAU OF</text>
      <text x="1060" y="76" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#6b7280">PRODUCTIVITY</text>

      <!-- The hype cycle curve -->
      <path d="M 70,480
               C 120,475 160,455 195,410
               C 230,360 270,250 320,160
               C 350,105 385,95 405,92
               C 425,95 450,115 475,175
               C 510,260 545,390 590,455
               C 620,480 650,490 685,485
               C 720,478 760,460 810,440
               C 860,420 900,405 950,390
               C 1000,378 1040,374 1080,370
               L 1150,368"
            fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Dashed future portion -->
      <path d="M 1080,370 L 1150,368"
            fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-dasharray="8,5" stroke-linecap="round"/>

      <!-- Axis labels -->
      <text x="32" y="110" text-anchor="middle" font-size="12" fill="#9ca3af" font-weight="600" transform="rotate(-90, 32, 300)">EXPECTATIONS</text>
      <text x="610" y="585" text-anchor="middle" font-size="12" fill="#9ca3af" font-weight="600">TIME</text>
      <text x="660" y="585" fill="#9ca3af" font-size="14">&#8594;</text>

      <!-- ===================== -->
      <!-- EVENT ANNOTATIONS     -->
      <!-- ===================== -->

      <!-- TRIGGER: 2011 — Founded -->
      <circle cx="90" cy="478" r="4" fill="#16a34a"/>
      <line x1="90" y1="473" x2="90" y2="340" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="96" y="330" font-size="11" font-weight="700" fill="#16a34a">2011</text>
      <text x="96" y="345" font-size="12" fill="#374151">Impossible founded</text>

      <!-- TRIGGER: 2016 — First product -->
      <circle cx="155" cy="445" r="4" fill="#16a34a"/>
      <line x1="155" y1="440" x2="155" y2="370" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="161" y="360" font-size="11" font-weight="700" fill="#16a34a">2016</text>
      <text x="161" y="375" font-size="12" fill="#374151">First burger launched</text>

      <!-- TRIGGER: 2017-18 -->
      <circle cx="200" cy="400" r="4" fill="#16a34a"/>
      <line x1="200" y1="404" x2="200" y2="440" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="168" y="456" font-size="11" font-weight="700" fill="#16a34a">2017-18</text>
      <text x="168" y="471" font-size="12" fill="#374151">White Castle; $750M</text>

      <!-- PEAK: Apr 2019 — BK Whopper -->
      <circle cx="295" cy="190" r="4" fill="#d97706"/>
      <line x1="295" y1="195" x2="260" y2="270" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="240" y="288" font-size="11" font-weight="700" fill="#d97706">Apr 2019</text>
      <text x="240" y="303" font-size="12" fill="#374151">BK Whopper launch</text>
      <text x="240" y="318" font-size="12" font-weight="700" fill="#374151">+16.8% foot traffic</text>

      <!-- PEAK: May 2019 — Beyond IPO -->
      <circle cx="335" cy="130" r="4" fill="#d97706"/>
      <line x1="335" y1="134" x2="335" y2="200" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="341" y="215" font-size="11" font-weight="700" fill="#d97706">May 2019</text>
      <text x="341" y="230" font-size="12" fill="#374151">Beyond Meat IPO</text>
      <text x="341" y="245" font-size="12" font-weight="700" fill="#374151">$234/share</text>

      <!-- "THE CASE" marker -->
      <circle cx="390" cy="96" r="7" fill="#dc2626"/>
      <line x1="390" y1="105" x2="390" y2="133" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,2"/>
      <rect x="348" y="133" width="84" height="24" rx="5" fill="#dc2626"/>
      <text x="390" y="150" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">THE CASE</text>
      <text x="390" y="172" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">Aug 2019</text>

      <!-- PEAK: 2020-21 -->
      <circle cx="435" cy="108" r="4" fill="#d97706"/>
      <line x1="435" y1="112" x2="458" y2="190" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="464" y="200" font-size="11" font-weight="700" fill="#d97706">2020-21</text>
      <text x="464" y="215" font-size="12" fill="#374151">$7B valuation</text>
      <text x="464" y="230" font-size="12" fill="#374151">IPO explored at $10B</text>

      <!-- TROUGH: 2022 — Brown out -->
      <circle cx="510" cy="260" r="4" fill="#dc2626"/>
      <line x1="510" y1="255" x2="510" y2="155" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="516" y="148" font-size="11" font-weight="700" fill="#dc2626">2022</text>
      <text x="516" y="163" font-size="12" fill="#374151">Brown steps down</text>
      <text x="516" y="178" font-size="12" fill="#374151">Layoffs begin (6%)</text>

      <!-- TROUGH: 2023 — Crash -->
      <circle cx="570" cy="435" r="4" fill="#dc2626"/>
      <line x1="570" y1="430" x2="570" y2="310" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="576" y="303" font-size="11" font-weight="700" fill="#dc2626">2023</text>
      <text x="576" y="318" font-size="12" fill="#374151">Beyond Meat: $0.79</text>
      <text x="576" y="333" font-size="12" fill="#374151">Sales -30%; shelf -31%</text>
      <text x="576" y="348" font-size="12" fill="#374151">20% more layoffs</text>

      <!-- TROUGH: 2024 — Backlash -->
      <circle cx="650" cy="488" r="4" fill="#dc2626"/>
      <line x1="650" y1="484" x2="650" y2="410" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="618" y="403" font-size="11" font-weight="700" fill="#dc2626">2024</text>
      <text x="618" y="418" font-size="12" fill="#374151">State bans; UPF backlash</text>
      <text x="618" y="433" font-size="12" fill="#374151">"Healthy" drops 50%→38%</text>

      <!-- SLOPE: 2024 — Rebrand -->
      <circle cx="800" cy="445" r="4" fill="#0369a1"/>
      <line x1="800" y1="440" x2="800" y2="310" stroke="#0369a1" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="765" y="298" font-size="11" font-weight="700" fill="#0369a1">2024</text>
      <text x="765" y="313" font-size="12" fill="#374151">Rebrand: green → red</text>
      <text x="765" y="328" font-size="12" font-weight="700" fill="#374151">LCA: 91% lower impact</text>

      <!-- SLOPE: 2025-26 -->
      <circle cx="930" cy="385" r="4" fill="#0369a1"/>
      <line x1="930" y1="389" x2="930" y2="440" stroke="#0369a1" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="888" y="456" font-size="11" font-weight="700" fill="#0369a1">2025-26</text>
      <text x="888" y="471" font-size="12" fill="#374151">Decline slowing (-7%)</text>
      <text x="888" y="486" font-size="12" fill="#374151">No CEO; no IPO</text>

      <!-- PLATEAU: question mark -->
      <text x="1060" y="355" text-anchor="middle" font-size="44" fill="#d1d5db" font-weight="300">?</text>
      <text x="1060" y="380" text-anchor="middle" font-size="13" fill="#9ca3af">Niche product?</text>
      <text x="1060" y="396" text-anchor="middle" font-size="13" fill="#9ca3af">Mainstream staple?</text>

    </svg>

    <footer>
      Adapted from Gartner Hype Cycle framework — SES Behavior Systems, Babson College
    </footer>
  </div>
</body>
</html>
